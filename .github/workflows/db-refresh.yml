name: DB Refresh

on:
  schedule:
    # GitHub Actions cron is UTC. 09:30 UTC Saturday = 01:30 PST Saturday.
    - cron: '30 9 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate data
        run: npm run build

      - name: Check for data changes
        id: diff
        run: |
          if git diff --quiet -- thrustcurve-db.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, commit, and tag
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: weekly data refresh' thrustcurve-db.json
          npm version patch -m 'chore(release): v%s'
          git push origin HEAD:main --follow-tags

      - name: Publish to npm
        if: steps.diff.outputs.changed == 'true'
        run: npm publish --access public --provenance
